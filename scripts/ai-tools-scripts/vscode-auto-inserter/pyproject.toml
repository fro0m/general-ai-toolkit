[project]
name = "auto-inserter"
version = "0.1.0"
description = "Automated keyboard task execution at regular intervals"
authors = [
    {name = "Dev"}
]
readme = "README.md"
requires-python = ">=3.8,<4.0"
dependencies = [
    "pynput (>=1.8.1,<2.0.0)",
    "schedule (>=1.2.2,<2.0.0)",
    "loguru (>=0.7.3,<0.8.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
auto-inserter = "auto-inserter.main:main"
