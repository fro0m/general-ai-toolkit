[tool.poetry]
name = "rules-converter"
version = "0.1.0"
description = "Convert Cursor IDE rules MDC files to VS Code instruction files"
authors = [
    "Developer <dev@example.com>"
]
readme = "README.md"
packages = [{include = "rules_converter", from = "src"}]

[tool.poetry.dependencies]
python = "^3.8"
click = "^8.1.3"

[tool.poetry.scripts]
rules-converter = "rules_converter.cli:main"


[build-system]
requires = ["poetry-core>=1.0.0,<2.0.0"]
build-backend = "poetry.core.masonry.api"
